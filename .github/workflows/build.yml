name: build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: 'android-36'
      ANDROID_PLATFORM_LEGACY: 'android-29'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '29.0.14206865'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # ProotX build toolchain: Gradle 8.11.1 / AGP 8.10.1 / Kotlin 2.2.20.
      # The Gradle build runs on JDK 17, so a single modern JDK is used for
      # both the Android SDK/NDK bootstrap and the Gradle build.
      # ------------------------------------------------------------------
      - name: Set up JDK 17 (Android SDK tooling + Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show active Java
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android v3 defaults to installing "tools platform-tools"; the
          # legacy `tools` package is no longer published and now fails
          # ("Failed to find package 'tools'"). Skip the default install and own
          # the packages explicitly in the pinned step below.
          packages: ''

      - name: Install pinned Android SDK/NDK packages
        run: |
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;$ANDROID_PLATFORM" "platforms;$ANDROID_PLATFORM_LEGACY" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"

      - name: Verify installed SDK/NDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms"
          ls "$SDK_ROOT/build-tools"
          ls "$SDK_ROOT/ndk"

      - name: Configure local.properties
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # The Gradle module `ndkVersion` is the authoritative NDK selector; a
          # deprecated ndk.dir entry is intentionally not written here.
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew clean assembleDebug testDebugUnitTest :app:bundleDebug --no-daemon

      - name: Verify pinned support release staging
        run: |
          set -euo pipefail
          ./gradlew :app:prepareProotXSupport --no-daemon
          MAP="app/build/generated/prootxSupport/assets/support/metadata/support-map.json"
          test -f "$MAP"
          python3 - <<'PY'
          import json, glob, os
          m = json.load(open("app/build/generated/prootxSupport/assets/support/metadata/support-map.json"))
          assert m["release"] == "v1.2.0", m["release"]
          assert m["supportedAbis"] == ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"], m["supportedAbis"]
          for abi in m["supportedAbis"]:
              assert m["abis"][abi]["modern"], abi
              assert m["abis"][abi]["legacy"], abi
          jni = glob.glob("app/build/generated/prootxSupport/jniLibs/*/*.so")
          assert jni, "no modern native files staged"
          print(f"support staging OK: release={m['release']} common={len(m['common'])} "
                f"modern={len(jni)} abis={m['supportedAbis']}")
          PY

      - name: Whole-app static 16 KB support packaging gate (APK + AAB)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -name zipalign | sort | tail -1)"
          echo "zipalign=$ZIPALIGN"
          curl -fsSL -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          python3 tools/verify_support_packaging.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --aab app/build/outputs/bundle/debug/app-debug.aab \
            --zipalign "$ZIPALIGN" \
            --bundletool /tmp/bundletool.jar \
            --java "$JAVA_HOME/bin/java"

      - name: Packaging verifier self-test
        run: python3 tools/test_verify_support_packaging.py

      - name: Report unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              print("UNIT TEST RESULTS: no result files found")
              raise SystemExit(0)

          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))

          print(
              "UNIT TEST RESULTS: "
              f"suites={len(files)} tests={tests} failures={failures} "
              f"errors={errors} skipped={skipped}"
          )
          PY

      - name: Verify in-tree 16 KB native alignment (arm64-v8a, x86_64)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          READELF="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP="$(mktemp -d)"
          # Only the in-tree terminal-emulator library is owned by P1F1; the
          # ProotX-Assets-Support payloads are explicitly out of scope here.
          unzip -o -q "$APK" "lib/arm64-v8a/libtermux.so" "lib/x86_64/libtermux.so" -d "$TMP"
          fail=0
          for abi in arm64-v8a x86_64; do
            so="$TMP/lib/$abi/libtermux.so"
            echo "== $abi libtermux.so =="
            if [ ! -f "$so" ]; then
              echo "MISSING: $so"
              fail=1
              continue
            fi
            loads=$("$READELF" -lW "$so" | awk '/LOAD/ { print $NF }')
            if [ -z "$loads" ]; then
              echo "NO PT_LOAD SEGMENTS FOUND"
              fail=1
              continue
            fi
            for a in $loads; do
              echo "  PT_LOAD align=$a"
              hex="${a#0x}"
              if [ "$((16#$hex))" -lt 16384 ]; then
                echo "  FAIL: PT_LOAD alignment below 0x4000"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "In-tree 16 KB native alignment check FAILED"
            exit 1
          fi
          echo "In-tree 16 KB native alignment check PASSED"

      - name: Build debug androidTest APK
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prootx-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: prootx-debug-aab
          path: app/build/outputs/bundle/debug/*.aab

      - name: Upload debug androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: prootx-debug-androidTest-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
