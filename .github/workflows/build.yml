name: build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: 'android-30'
      ANDROID_PLATFORM_LEGACY: 'android-29'
      ANDROID_BUILD_TOOLS: '30.0.2'
      ANDROID_NDK_VERSION: '21.4.7075529'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Stage 1 — Android SDK/NDK bootstrap under a modern JVM.
      #
      # Android command-line tools (sdkmanager) require a modern Java
      # runtime, so the SDK is provisioned before the legacy JDK is
      # activated.
      # ------------------------------------------------------------------
      - name: Set up JDK 17 (Android SDK tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show active Java (SDK bootstrap stage)
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android v3 defaults to installing "tools platform-tools"; the
          # legacy `tools` package is no longer published and now fails
          # ("Failed to find package 'tools'"). Skip the default install and own
          # the packages explicitly in the pinned step below.
          packages: ''

      - name: Install pinned Android SDK/NDK packages
        run: |
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;$ANDROID_PLATFORM" "platforms;$ANDROID_PLATFORM_LEGACY" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"

      - name: Verify installed SDK/NDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms"
          ls "$SDK_ROOT/build-tools"
          ls "$SDK_ROOT/ndk"

      # ------------------------------------------------------------------
      # Stage 2 — ProotX bridge build under JDK 8.
      #
      # The ProotX build (Gradle 6.7.1 / AGP 4.2.2 / Kotlin 1.4.32) runs on
      # JDK 8. Do not change the build toolchain here.
      # ------------------------------------------------------------------
      - name: Set up JDK 8 (legacy Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Configure local.properties
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ndk.dir=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> local.properties

      - name: Show active Java (build stage)
        run: java -version

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build and test (legacy toolchain)
        run: ./gradlew clean assembleDebug testDebugUnitTest --no-daemon

      - name: Report unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              print("UNIT TEST RESULTS: no result files found")
              raise SystemExit(0)

          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))

          print(
              "UNIT TEST RESULTS: "
              f"suites={len(files)} tests={tests} failures={failures} "
              f"errors={errors} skipped={skipped}"
          )
          PY

      - name: Build debug androidTest APK
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prootx-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload debug androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: prootx-debug-androidTest-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
